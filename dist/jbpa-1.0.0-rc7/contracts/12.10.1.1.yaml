schema_version: '1.0'
package_version: 12.10.1.1
qualification: TESTED_LIVE
platform:
  os: ubuntu
  version: 24.04.5
  architecture: amd64
  package_kind: deb
scope:
  - install
  - registration
  - initial-health
  - drain
  - uninstall
  - reinstall
  - endpoint-trust
evidence_refs:
  - evidence/pa-12.10.1.1/ubuntu-24.04/runtime-contract.yaml
  - evidence/pa-12.10.1.1/ubuntu-24.04/uninstall/uninstall-result.json
  - evidence/pa-12.10.1.1/ubuntu-24.04/reinstall/reinstall-result.json
  - evidence/pa-12.10.1.1/ubuntu-24.04/enterprise/jks/requalification-import-result.json
adapter_profile: native-deb-register-json
dimensions:
  dependencies:
    - odbcinst
    - unixodbc
  silent_install: silent_install=1 dpkg --install
  paths:
    root: /opt/jitterbit
    resources: /opt/jitterbit/Resources
    register: /opt/jitterbit/Resources/register.json
    credentials: /opt/jitterbit/Resources/credentials.txt
    jre: /opt/jitterbit/jre
    keytool: /opt/jitterbit/jre/bin/keytool
    cacerts: /opt/jitterbit/jre/lib/security/cacerts
    log_root: /opt/jitterbit/log
    agent_log: /opt/jitterbit/log/jitterbit-agent.log
    installer_log: /opt/jitterbit/log/Installer.log
    postgres: /opt/jitterbit/pgsql
    postgres_data: /opt/jitterbit/DataInterchange/pgsql
  registration:
    strategy: register-json-token
    proxy: false
    required_markers:
      - Auto Registration - Completed!
      - 'Read agent credentials file: /opt/jitterbit/Resources/credentials.txt'
      - 'REST API RESPONSE: Status: true'
      - connection to agent services has been established
      - Connection established, agent logged in, and request flow has commenced
      - Agent synchronization for agent group ID
  health_profiles:
    INITIAL_REGISTRATION:
      synchronization: MANDATORY
      core_services: MANDATORY
    STEADY_STATE_EXISTING_AGENT:
      identity: MANDATORY
      connection_check: MANDATORY
      core_services: MANDATORY
      fresh_sync: NOT_REQUIRED
      service_status: SUPPLEMENTARY
    EXISTING_AGENT_RESTART:
      fresh_identity_authentication: MANDATORY
      agent_services: MANDATORY
      request_flow: MANDATORY
      connection_check: MANDATORY
      core_services: MANDATORY
      fresh_sync: SUPPLEMENTARY
      service_status: SUPPLEMENTARY
    POST_CONFIGURATION_RESTART:
      inherits: EXISTING_AGENT_RESTART
    POST_ROLLBACK_RESTART:
      inherits: EXISTING_AGENT_RESTART
      restored_file: MANDATORY
  service_contract:
    - JitterbitProcessEngine
    - Scheduler
    - FileCleanup
    - VerboseLogShipper
  operation_status_provider:
    provider: TranDb
    active_statuses:
      - 0
      - 1
      - 3
      - 8
      - 10
    postgres: /opt/jitterbit/pgsql
    qualification: TESTED_LIVE
  drain_behavior: drain-pause; active count zero; drain-stop; core stopped
  uninstall_behavior: package purge; account remove; exact product residual cleanup;
    clean-host verification
startup_observation_seconds: 175.308
